# Tropic Line CI: build, a blocking security stage, a hardened test deployment scanned by ZAP, then publish.
# Every gate writes a readable summary on the run page (scripts/ci/summary.mjs); the last job sums them all up.
# Blocking rules and exceptions: docs/pipeline-policy.md. The same checks run locally with scripts/security-scan.sh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Scanners run as pinned container images instead of third-party actions.
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:1.182.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: API — install and syntax check
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          find src db -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Shop — install, type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ---------------------------------------------------------------- security stage
  secrets:
    name: "Security · Secrets (Gitleaks)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the last commit
          persist-credentials: false
      - name: Scan every commit for secrets (values redacted)
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/reports/gitleaks.json --exit-code 1
      - name: Summary
        if: always()
        run: node scripts/ci/summary.mjs gitleaks reports/gitleaks.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gitleaks-report
          path: reports/

  sast:
    name: "Security · Code (Semgrep)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Static analysis
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/default --config .semgrep/ --metrics=off \
            --sarif-output=reports/semgrep.sarif --json-output=reports/semgrep.json backend/src frontend/src
      - name: Summary
        if: always()
        run: node scripts/ci/summary.mjs semgrep reports/semgrep.json >> "$GITHUB_STEP_SUMMARY"
      - name: Block on ERROR findings
        run: |
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' reports/semgrep.json)
          echo "Blocking findings (ERROR): $errors"
          test "$errors" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-report
          path: reports/

  dependencies:
    name: "Security · Dependencies (Trivy)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full report (all severities)
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --ignorefile .trivyignore --format json --output reports/dependencies.json .
      - name: Summary
        if: always()
        run: node scripts/ci/summary.mjs trivy reports/dependencies.json "Dependencies (package-lock.json)" >> "$GITHUB_STEP_SUMMARY"
      - name: Block on HIGH and CRITICAL with a fix available
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs --quiet --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependencies-report
          path: reports/

  iac:
    name: "Security · Deployment files (Trivy config)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfiles, Compose and Kubernetes manifests
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config --quiet --format json --output reports/iac.json .
      - name: Summary
        if: always()
        run: node scripts/ci/summary.mjs config reports/iac.json >> "$GITHUB_STEP_SUMMARY"
      - name: Block on HIGH and CRITICAL
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config --quiet --severity HIGH,CRITICAL --exit-code 1 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iac-report
          path: reports/

  image:
    name: "Security · Images (Trivy)"
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t "tropicline-${{ matrix.service }}:ci" "${{ matrix.service }}"
      - name: Runs as a non-root user
        run: |
          user=$(docker image inspect "tropicline-${{ matrix.service }}:ci" --format '{{.Config.User}}')
          echo "Image user: '${user}'"
          case "${user%%:*}" in ""|root|0) echo "::error::The image runs as root"; exit 1;; esac
          echo "Image \`tropicline-${{ matrix.service }}\` runs as user \`${user}\` (not root)." >> "$GITHUB_STEP_SUMMARY"
      - name: Full report (all severities)
        run: |
          mkdir -p reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --quiet \
            --scanners vuln,secret --ignorefile .trivyignore --format json --output reports/image.json \
            "tropicline-${{ matrix.service }}:ci"
      - name: Summary
        if: always()
        run: node scripts/ci/summary.mjs trivy reports/image.json "Image ${{ matrix.service == 'backend' && 'api (distroless Node.js)' || 'web (nginx)' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Block on vulnerable packages or secrets in the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image --quiet \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore \
            --exit-code 1 "tropicline-${{ matrix.service }}:ci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-${{ matrix.service }}-report
          path: reports/

  # ---------------------------------------------------------------- deploy + dynamic testing
  dast:
    name: "Deploy to Kubernetes + ZAP (authenticated)"
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy (kind cluster, Kyverno, NetworkPolicies, secrets created at runtime)
        run: bash scripts/k8s/up.sh
      - name: Check the hardening on the live cluster
        run: bash scripts/k8s/verify.sh
      - name: Security regression tests (one per planted flaw)
        if: success() || failure()
        run: |
          mkdir -p reports
          BASE_URL=http://127.0.0.1:8090 node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/ci/md-reporter.mjs --test-reporter-destination=reports/tests.md \
            "backend/test/*.test.mjs"
      - name: Tests summary
        if: success() || failure()
        run: cat reports/tests.md >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticated ZAP scan
        if: success() || failure()
        run: bash scripts/zap-scan.sh
      # The tests (brute force) and ZAP (injection, access probing) just attacked the app: each rule must have fired.
      - name: Runtime detection (alerts in the API logs)
        if: success() || failure()
        run: REQUIRE=brute_force,injection_probe,access_probe bash scripts/detections.sh
      - name: Cluster state (for debugging)
        if: failure()
        run: |
          kubectl --context kind-tropicline get pods,events -A | tail -60
          kubectl --context kind-tropicline -n tropicline logs deployment/api --tail=50 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dast-report
          path: reports/

  # ---------------------------------------------------------------- overview of every gate
  report:
    name: Security report
    runs-on: ubuntu-24.04
    needs: [build, secrets, sast, dependencies, iac, image, dast]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
      - name: Build the report
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/summary.mjs report reports >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: reports/security-report.json

  # ---------------------------------------------------------------- publish
  publish:
    name: Publish images
    runs-on: ubuntu-24.04
    needs: [secrets, sast, dependencies, iac, image, dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service == 'backend' && 'api' || 'web' }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main

