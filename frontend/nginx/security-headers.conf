# Security headers for every response of the shop (included at server level and in each location that sets
# its own add_header, because nginx drops inherited add_header lines in that case).
#
# Content-Security-Policy (V5, V8): scripts only from this site, no inline script or event handler (so injected
# HTML cannot run code), styles from this site and Google Fonts, no plugins, no framing by other sites.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# No Strict-Transport-Security: the test environments are plain HTTP. Add it with TLS in production.
