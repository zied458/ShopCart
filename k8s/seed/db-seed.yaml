apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: tropicline
  labels: { app.kubernetes.io/name: db-seed, app.kubernetes.io/part-of: tropicline }
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-seed, app.kubernetes.io/part-of: tropicline }
    spec:
      restartPolicy: Never
      serviceAccountName: db-seed
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: ghcr.io/saramseibi/shopcart-api:local
          imagePullPolicy: IfNotPresent
          args: [db/init.js]
          env:
            - { name: DB_HOST, value: db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_PASSWORD_FILE, value: /run/secrets/tropicline/db-password }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/tropicline, readOnly: true }
      volumes:
        - name: secrets
          secret:
            secretName: tropicline-secrets
            defaultMode: 0440
            items: [{ key: db-password, path: db-password }] # a seed job does not need the signing key
