# One identity per workload. None is bound to any Role: they have no rights on the Kubernetes API,
# and no token is mounted in the pods (least privilege).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: tropicline
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: tropicline
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  namespace: tropicline
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-seed
  namespace: tropicline
automountServiceAccountToken: false
