# PostgreSQL: one replica, its own volume, reachable only from the API and the seed job.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tropicline
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: db }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: tropicline
  labels: { app.kubernetes.io/name: db }
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: db }
  template:
    metadata:
      labels: { app.kubernetes.io/name: db }
    spec:
      serviceAccountName: db
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # "postgres" in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          env:
            - { name: POSTGRES_DB, value: tropicline }
            - { name: POSTGRES_USER, value: tropicline }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/tropicline/db-password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, tropicline, -d, tropicline] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, tropicline, -d, tropicline] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets/tropicline, readOnly: true }
      volumes:
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - name: secrets
          secret:
            secretName: tropicline-secrets
            defaultMode: 0440
            items: [{ key: db-password, path: db-password }] # the database never gets the signing key
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
