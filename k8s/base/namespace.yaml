# Pod Security Admission rejects any pod that does not meet the "restricted" profile:
# non-root, no privilege escalation, all capabilities dropped, seccomp on.
apiVersion: v1
kind: Namespace
metadata:
  name: tropicline
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
