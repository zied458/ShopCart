# Local test cluster (kind = Kubernetes in Docker), used on a laptop and in CI.
#   kind create cluster --config k8s/kind-cluster.yaml
# The shop's NodePort 30080 is published on http://127.0.0.1:8090 only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tropicline
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
